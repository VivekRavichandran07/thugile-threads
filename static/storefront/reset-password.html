<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Thugile & Threads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/storefront/style.css" />
  <link rel="icon" href="/static/storefront/assets/thugile-and-threads-logo.png" type="image/png">
</head>
<body>
  <div class="grain"></div>

  <a class="floating-logo" href="#top" aria-label="Thugile and Threads home">
    <img src="/static/storefront/assets/thugile-and-threads-logo.png" alt="Thugile & Threads">
    <span class="logo-text">Thugile & Threads</span>
  </a>

  <header class="site-header">
    <div class="announcement-bar"><div class="announcement-bar-inner"><span>Free shipping on orders above ₹2,499 · 2+ items 10% off · 3+ items 15% off * No COD * No Returns</span><span>Free shipping on orders above ₹2,499 · 2+ items 10% off · 3+ items 15% off * No COD * No Returns</span></div></div>
    <div class="header-inner">
      <nav class="main-nav">
        <a href="/shop/collections">Collections</a>
        <a href="/shop/our-story">Our story</a>
        <a href="#contact">Visit us</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn search-btn" aria-label="Search">⌕</button>
        <div id="search-overlay" class="search-overlay">
          <input type="text" id="search-input" placeholder="Search products..." class="search-input" />
          <div id="search-results" class="search-results"></div>
        </div>
        <button class="icon-btn wishlist-btn-header" aria-label="Wishlist">♡</button>
        <button class="bag" id="bag-btn" aria-label="Bag">
          <span class="bag-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          </span>
          <span class="bag-count" id="bag-count" style="display:none">0</span>
        </button>
        <button class="icon-btn auth-btn-header" id="auth-btn" aria-label="Account">👤</button>
      </div>
    </div>
  </header>

  <main style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:100px 20px;">
    <div style="max-width:420px;width:100%;">
      <h1 style="font-family:var(--serif);font-size:clamp(2rem,4.5vw,3rem);margin:0 0 12px;letter-spacing:-.03em;">Reset Password</h1>
      <p style="margin:0 0 24px;color:#5c5248;font-size:16px;">Enter your new password below.</p>
      <form id="reset-form" style="display:flex;flex-direction:column;gap:12px;">
        <input type="password" id="reset-password" placeholder="New password (min 6 chars)" required style="width:100%;padding:12px;border:1px solid var(--line);font:400 14px var(--sans);box-sizing:border-box;">
        <input type="password" id="reset-confirm" placeholder="Confirm new password" required style="width:100%;padding:12px;border:1px solid var(--line);font:400 14px var(--sans);box-sizing:border-box;">
        <button type="submit" style="width:100%;padding:14px;background:var(--ink);color:#fff;border:0;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;">Reset Password</button>
        <p id="reset-error" style="margin:0;font-size:13px;color:#c0392b;min-height:18px;"></p>
      </form>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="/static/storefront/script.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const resetForm = document.getElementById('reset-form');
    const resetError = document.getElementById('reset-error');
    const toast = document.getElementById('toast');
    let toastTimer;

    if (!token) {
      resetError.textContent = 'Invalid or expired reset link.';
      resetForm.style.display = 'none';
    }

    if (resetForm) {
      resetForm.addEventListener('submit', async e => {
        e.preventDefault();
        resetError.textContent = '';
        const password = document.getElementById('reset-password').value;
        const confirm = document.getElementById('reset-confirm').value;
        if (!password || password.length < 6) {
          resetError.textContent = 'Password must be at least 6 characters.';
          return;
        }
        if (password !== confirm) {
          resetError.textContent = 'Passwords do not match.';
          return;
        }
        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            resetError.textContent = data.error || 'Password reset failed';
            return;
          }
          toast.textContent = 'Password reset successful. Redirecting to login...';
          toast.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => { window.location.href = '/shop/'; }, 2000);
        } catch {
          resetError.textContent = 'Network error. Try again.';
        }
      });
    }
  </script>
</body>
</html>
