<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Thugile & Threads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clarity+City:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/storefront/style.css" />
  <link rel="icon" href="/static/storefront/assets/thugile-and-threads-logo.webp" type="image/webp">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Cormorant+Garamond:wght@500;600&family=DM+Serif+Display&family=Italiana&family=Prata&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&display=swap" rel="stylesheet">
</head>
<body>
  <div class="grain"></div>

  <header class="site-header">
    <div class="announcement-bar"><div class="announcement-bar-inner"><span>Free shipping on orders above ₹2,499 · 2+ items 10% off · 3+ items 15% off * No COD * No Returns</span><span>Free shipping on orders above ₹2,499 · 2+ items 10% off · 3+ items 15% off * No COD * No Returns</span></div></div>
    <div class="header-inner">
      <a class="header-wordmark" href="/shop/">Thugile &amp; Threads</a>
      <nav class="main-nav">
        <a href="/shop/collections">Collections</a>
        <a href="/shop/our-story">Our story</a>
        <a href="/shop/contact">Visit us</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn search-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
        <div id="search-overlay" class="search-overlay">
          <input type="text" id="search-input" placeholder="Search products..." class="search-input" />
          <div id="search-results" class="search-results"></div>
        </div>
        <button class="icon-btn wishlist-btn-header" aria-label="Wishlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button>
        <button class="bag" id="bag-btn" aria-label="Bag">
          <span class="bag-icon-wrap">
            <img src="/static/storefront/assets/shopping.png" alt="" aria-hidden="true" width="24" height="24">
          </span>
          <span class="bag-count" id="bag-count" style="display:none">0</span>
        </button>
        <button class="icon-btn auth-btn-header" id="auth-btn" aria-label="Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg></button>
      </div>
    </div>
  </header>

  <main style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:100px 20px;">
    <div style="max-width:420px;width:100%;">
      <h1 style="font-family:var(--serif);font-size:clamp(2rem,4.5vw,3rem);margin:0 0 12px;letter-spacing:-.03em;">Reset Password</h1>
      <p style="margin:0 0 24px;color:#5c5248;font-size:16px;">Enter your new password below.</p>
      <form id="reset-form" style="display:flex;flex-direction:column;gap:12px;">
        <input type="password" id="reset-password" minlength="10" placeholder="New password (min 10 chars)" required style="width:100%;padding:12px;border:1px solid var(--line);font:400 14px var(--sans);box-sizing:border-box;">
        <input type="password" id="reset-confirm" placeholder="Confirm new password" required style="width:100%;padding:12px;border:1px solid var(--line);font:400 14px var(--sans);box-sizing:border-box;">
        <button type="submit" style="width:100%;padding:14px;background:var(--ink);color:#fff;border:0;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;">Reset Password</button>
        <p id="reset-error" style="margin:0;font-size:13px;color:#c0392b;min-height:18px;"></p>
      </form>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="/static/storefront/script.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const resetForm = document.getElementById('reset-form');
    const resetError = document.getElementById('reset-error');
    const toast = document.getElementById('toast');
    let toastTimer;

    if (!token) {
      resetError.textContent = 'Invalid or expired reset link.';
      resetForm.style.display = 'none';
    }

    if (resetForm) {
      resetForm.addEventListener('submit', async e => {
        e.preventDefault();
        resetError.textContent = '';
        const password = document.getElementById('reset-password').value;
        const confirm = document.getElementById('reset-confirm').value;
        if (!password || password.length < 10) {
          resetError.textContent = 'Password must be at least 10 characters.';
          return;
        }
        if (password !== confirm) {
          resetError.textContent = 'Passwords do not match.';
          return;
        }
        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            resetError.textContent = data.error || 'Password reset failed';
            return;
          }
          toast.textContent = 'Password reset successful. Redirecting to login...';
          toast.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => { window.location.href = '/shop/'; }, 2000);
        } catch {
          resetError.textContent = 'Network error. Try again.';
        }
      });
    }
  </script>
</body>
</html>
