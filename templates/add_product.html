{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
    <h1>Add Product</h1>

    <form class="card-form" method="POST" enctype="multipart/form-data">
        <label>Product Name</label>
        <input type="text" name="name" required>

        <label>SKU (unique code)</label>
        <input type="text" name="sku" required>

        <label>Category</label>
        <input type="text" name="category" placeholder="e.g. Saree, Kurti, Shirt">

        <label>Size</label>
        <input type="text" name="size" placeholder="e.g. S, M, L, Free Size">

        <label>Color</label>
        <input type="text" name="color">

        <label>Product Image URL</label>
        <input type="text" name="image_url" placeholder="https://example.com/chudidar.jpg">
        <label>Or upload image</label>
        <input type="file" name="product_image" accept="image/png,image/jpeg,image/webp">

        <label>Cost Price (₹ per unit)</label>
        <input type="number" step="0.01" min="0" name="cost_price" required>

        <label>Selling Price (₹ per unit)</label>
        <input type="number" step="0.01" min="0" name="selling_price" required>

        <label>Discounted Price (₹ per unit)</label>
        <input type="number" step="0.01" min="0" name="discounted_price" required>

        <label>Opening Quantity</label>
        <input type="number" min="0" name="quantity" value="0">

        <label>Reorder Level (low stock alert threshold)</label>
        <input type="number" min="0" name="reorder_level" value="5">

        <div class="form-actions">
            <button class="btn" type="submit">Save Product</button>
            <a class="back-link" href="{{ url_for('products') }}">Cancel</a>
        </div>
    </form>
{% endblock %}
