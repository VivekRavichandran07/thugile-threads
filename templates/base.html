<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Inventory Management{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body{% if show_login %} data-show-login="true"{% endif %}>
    <nav class="navbar">
        <div class="brand"><a href="{{ url_for('dashboard') }}">Boutique Inventory</a></div>
        <ul>
            <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('products') }}">Products</a></li>
            <li><a href="{{ url_for('purchases') }}">Purchases</a></li>
            <li><a href="{{ url_for('sales') }}">Sales</a></li>
            <li><a href="{{ url_for('shop') }}" target="_blank">Storefront</a></li>
        </ul>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <div class="toast" id="toast" role="status"></div>

    <div class="auth-overlay" id="auth-overlay">
      <div class="auth-modal" id="auth-modal">
        <button class="auth-close" id="auth-close" aria-label="Close">×</button>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="signup">Sign Up</button>
        </div>
        <form class="auth-form" id="login-form">
          <input type="email" id="login-email" placeholder="Email" required>
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="submit" class="auth-submit">Login</button>
          <p class="auth-error" id="login-error"></p>
        </form>
        <form class="auth-form hidden" id="signup-form">
          <input type="text" id="signup-name" placeholder="Full Name" required>
          <input type="email" id="signup-email" placeholder="Email" required>
          <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required>
          <button type="submit" class="auth-submit">Create Account</button>
          <p class="auth-error" id="signup-error"></p>
        </form>
      </div>
    </div>

    <script src="{{ url_for('static', filename='storefront/script.js') }}"></script>
</body>
</html>
