{% extends "base.html" %}
{% block title %}Record Purchase{% endblock %}
{% block content %}
    <h1>Record Purchase (Stock In)</h1>

    {% if products %}
    <form class="card-form" method="POST">
        <label>Product</label>
        <select name="product_id" required>
            {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }} ({{ p.sku }}) — current stock: {{ p.quantity }}</option>
            {% endfor %}
        </select>

        <label>Quantity Purchased</label>
        <input type="number" min="1" name="quantity" required>

        <label>Cost Price (₹ per unit)</label>
        <input type="number" step="0.01" min="0" name="cost_price" required>

        <label>Supplier</label>
        <input type="text" name="supplier" placeholder="Optional">

        <div class="form-actions">
            <button class="btn" type="submit">Save Purchase</button>
            <a class="back-link" href="{{ url_for('purchases') }}">Cancel</a>
        </div>
    </form>
    {% else %}
        <p class="empty-state">Add a product first before recording a purchase.</p>
        <a class="btn" href="{{ url_for('add_product') }}">+ Add Product</a>
    {% endif %}
{% endblock %}
