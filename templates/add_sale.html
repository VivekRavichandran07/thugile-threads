{% extends "base.html" %}
{% block title %}Record Sale{% endblock %}
{% block content %}
    <h1>Record Sale (Stock Out)</h1>

    {% if products %}
    <form class="card-form" method="POST">
        <label>Product</label>
        <select name="product_id" required>
            {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }} ({{ p.sku }}) — available: {{ p.quantity }}</option>
            {% endfor %}
        </select>

        <label>Quantity Sold</label>
        <input type="number" min="1" name="quantity" required>

        <label>Selling Price (₹ per unit)</label>
        <input type="number" step="0.01" min="0" name="selling_price" required>

        <label>Customer</label>
        <input type="text" name="customer" placeholder="Optional">

        <div class="form-actions">
            <button class="btn" type="submit">Save Sale</button>
            <a class="back-link" href="{{ url_for('sales') }}">Cancel</a>
        </div>
    </form>
    {% else %}
        <p class="empty-state">Add a product first before recording a sale.</p>
        <a class="btn" href="{{ url_for('add_product') }}">+ Add Product</a>
    {% endif %}
{% endblock %}
