{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
    <h1>Edit Product</h1>

    <form class="card-form" method="POST" enctype="multipart/form-data">
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>

        <label>SKU (unique code)</label>
        <input type="text" name="sku" value="{{ product.sku }}" required>

        <label>Category</label>
        <input type="text" name="category" value="{{ product.category or '' }}">

        <label>Size</label>
        <select name="size" required>
            {% for size in ['S', 'M', 'L', 'XL', 'XXL', 'Free Size'] %}
            <option value="{{ size }}" {% if product.size == size %}selected{% endif %}>{{ size }}</option>
            {% endfor %}
        </select>

        <label>Color</label>
        <input type="text" name="color" value="{{ product.color or '' }}">

        <label>Product Image URL</label>
        <input type="text" name="image_url" value="{{ product.image_url or '' }}" placeholder="https://example.com/chudidar.jpg">
        <label>Or upload new image</label>
        <input type="file" name="product_image" accept="image/png,image/jpeg,image/webp">

        <label>Cost Price (₹ per unit)</label>
        <input type="number" step="0.01" min="0" name="cost_price" value="{{ product.cost_price }}" required>

        <label>Selling Price (₹ per unit)</label>
        <input type="number" step="0.01" min="0" name="selling_price" value="{{ product.selling_price }}" required>

        <label>Discounted Price (₹ per unit)</label>
        <input type="number" step="0.01" min="0" name="discounted_price" value="{{ product.discounted_price or product.selling_price }}" required>

        <label>Quantity by Size</label>
        <div class="size-quantity-list">
            {% for variant in product_variants %}
            <label>{{ variant.size or 'Free Size' }}
                <input type="number" min="0" name="quantity_{{ variant.id }}" value="{{ variant.quantity }}">
            </label>
            {% endfor %}
        </div>

        <label>Reorder Level</label>
        <input type="number" min="0" name="reorder_level" value="{{ product.reorder_level }}">

        <div class="form-actions">
            <button class="btn" type="submit">Update Product</button>
            <a class="back-link" href="{{ url_for('products') }}">Cancel</a>
        </div>
    </form>
{% endblock %}
